services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mdk7866/zscrape3-backend:latest
    container_name: zscrape3-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/downloads:/app/downloads
      # Kept out of the image on purpose (see backend/.dockerignore) — these are
      # real signed-in sessions. Writable; yt-dlp updates session cookies during extraction.
      - ./backend/cookies.txt:/app/cookies.txt
    env_file:
      - ./backend/.env
    environment:
      # Where yt-dlp fetches GVS PO tokens; without them YouTube drops to 360p.
      - POT_PROVIDER_URL=http://bgutil-provider:4416
    depends_on:
      - bgutil-provider
    restart: always

  # Supplies the PO tokens yt-dlp needs for full-quality YouTube downloads.
  # Keep this tag version-matched with bgutil-ytdlp-pot-provider in backend/pyproject.toml.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: zscrape3-potoken
    init: true
    restart: always

  frontend:
    build:
      context: ./frontendweb
      dockerfile: Dockerfile
      args:
        # Must be a build arg: Next.js inlines NEXT_PUBLIC_* into the browser
        # bundle at build time. Point this at wherever the backend is reachable
        # FROM THE USER'S BROWSER, not from inside the compose network.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: mdk7866/zscrape3-frontend:latest
    container_name: zscrape3-frontend
    ports:
      - "3000:3000"
    environment:
      # Only affects server-side rendering; the client bundle uses the build arg.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: zscrape3-network
