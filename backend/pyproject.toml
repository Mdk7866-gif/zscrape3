[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudinary>=1.44.1",
    "fastapi>=0.129.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "motor>=3.7.1",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "supabase>=2.30.0",
    "uvicorn>=0.40.0",
    "yt-dlp>=2026.7.4",
    # Solves YouTube's player JS challenge (needs a deno/node runtime present).
    "yt-dlp-ejs>=0.8.0",
    # Supplies GVS PO tokens; without them YouTube downloads drop to 360p.
    # Must stay version-matched with the provider service in docker-compose.yml.
    "bgutil-ytdlp-pot-provider>=1.3.1,<1.4",
    # Lets the Instagram extractor impersonate a real browser's TLS fingerprint,
    # which Instagram now requires to serve pages instead of a 403. Must stay in
    # yt-dlp's supported range: 0.5.10, or 0.10.x-0.15.x (checked at import time).
    "curl_cffi>=0.13,<0.16",
]

[project.scripts]
dev = "app.main:start"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
]
