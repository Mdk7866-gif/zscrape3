services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mdk7866/zscrape3-backend:latest
    container_name: zscrape3-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/downloads:/app/downloads
    env_file:
      - ./backend/.env
    environment:
      # Where yt-dlp fetches GVS PO tokens; without them YouTube drops to 360p.
      - POT_PROVIDER_URL=http://bgutil-provider:4416
    depends_on:
      - bgutil-provider
    restart: always

  # Supplies the PO tokens yt-dlp needs for full-quality YouTube downloads.
  # Keep this tag version-matched with bgutil-ytdlp-pot-provider in backend/pyproject.toml.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: zscrape3-potoken
    init: true
    restart: always

  frontend:
    build:
      context: ./frontendweb
      dockerfile: Dockerfile
    image: mdk7866/zscrape3-frontend:latest
    container_name: zscrape3-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: zscrape3-network
